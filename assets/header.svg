<svg xmlns="http://www.w3.org/2000/svg" width="836" height="170" viewBox="0 0 836 170" role="img" aria-label="Marcos Junior Dev — Full Stack Developer | C# | .NET | SQL" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#101a26"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39c5cf"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
    <!-- A área visível cresce da esquerda para a direita, revelando o texto -->
    <clipPath id="reveal">
      <rect x="0" y="0" width="0" height="170">
        <animate attributeName="width" from="0" to="500" begin="0.4s" dur="2.4s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="835" height="169" rx="14" fill="url(#bg)" stroke="#30363d"/>

  <text x="32" y="38" font-family="ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace" font-size="13" fill="#8b949e">~/portfolio $ whoami</text>

  <!-- Nome -->
  <g clip-path="url(#reveal)">
    <text x="32" y="92" font-family="ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace" font-size="44" font-weight="700" fill="url(#accent)" textLength="450" lengthAdjust="spacingAndGlyphs">Marcos Junior Dev</text>
  </g>

  <!-- Cursor: acompanha a digitação e depois pisca -->
  <rect x="32" y="56" width="3" height="46" fill="#39c5cf">
    <animate attributeName="x" from="32" to="484" begin="0.4s" dur="2.4s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0;1" dur="1s" begin="2.8s" repeatCount="indefinite"/>
  </rect>

  <!-- Subtítulo aparece depois da digitação -->
  <text x="32" y="128" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#e6edf3" opacity="0">
    Full Stack Developer | C# | .NET | SQL
    <animate attributeName="opacity" from="0" to="1" begin="2.8s" dur="0.6s" fill="freeze"/>
  </text>
  <text x="32" y="152" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e" opacity="0">
    Louveira, SP · Análise e Desenvolvimento de Sistemas — UNIP Jundiaí
    <animate attributeName="opacity" from="0" to="1" begin="3.1s" dur="0.6s" fill="freeze"/>
  </text>
</svg>
